project:
  title: "Systolic Array Accelerator"
  team: "A34 SiliconForge"
  discord: ""
  description: "4x4 FP16 systolic array accelerator (approximate multiplier, Q16.16 accumulation) on GF180MCU 180nm"
  lvs_config: "lvs_config.json"
  gf_def_ready: true
  ws_def_ready: false
  drc_ready: true
  lvs_ready: true
  export_control: "documents/Export_Control_GF_Rev8.2_A34.docx"

pins:
  - name: VSS
    io_type: ground

  - name: VDD
    io_type: power

  - name: rst_n
    io_type: input_schmitt

  - name: clk
    io_type: input_cmos

  - name: input_in_0
    io_type: input_cmos

  - name: input_in_1
    io_type: input_cmos

  - name: input_in_2
    io_type: input_cmos

  - name: input_in_3
    io_type: input_cmos

  - name: input_in_4
    io_type: input_cmos

  - name: input_in_5
    io_type: input_cmos

  - name: input_in_6
    io_type: input_cmos

  - name: input_in_7
    io_type: input_cmos

  - name: output_out_0
    io_type: bidirectional

  - name: output_out_1
    io_type: bidirectional

  - name: output_out_2
    io_type: bidirectional

  - name: output_out_3
    io_type: bidirectional
