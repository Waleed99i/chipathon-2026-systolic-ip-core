# Standalone hardening config for the chip_core block (systolic accelerator + I/O logic).
# Runs the LibreLane Classic flow — no padring, no top-level chip integration.
# Follows the same pattern as the official chipathon example (counter_macro.yaml / alu_macro.yaml).
meta:
  version: 3
  flow: Classic
DESIGN_NAME: chip_core
VERILOG_DEFINES:
- USE_POWER_PINS
VERILOG_FILES:
- dir::../src/chipathon_wrapper/chip_core.sv
- dir::../src/rtl/reg_def.v
- dir::../src/rtl/counter.v
- dir::../src/rtl/controlled_counter.v
- dir::../src/rtl/fp16_multiplier_exception.v
- dir::../src/rtl/fp16_multiplier_exponent.v
- dir::../src/rtl/fp16_approximate_multiplier.v
- dir::../src/rtl/fp16_to_fp32.v
- dir::../src/rtl/fp32_to_fp16.v
- dir::../src/rtl/fp16_to_q8_8.v
- dir::../src/rtl/fp16_to_q16_16.v
- dir::../src/rtl/fp16_to_q16_16_approximate_mac.v
- dir::../src/rtl/q16_16_to_fp16.v
- dir::../src/rtl/q16_16_to_fp32.v
- dir::../src/rtl/pe.v
- dir::../src/rtl/data_feeder.v
- dir::../src/rtl/input_datapath.v
- dir::../src/rtl/output_datapath.v
- dir::../src/rtl/rv_protocol.v
- dir::../src/rtl/systolic.v
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 45   # ns — FINAL selected config
CTS_SINK_CLUSTERING_ENABLE: true
CTS_SINK_CLUSTERING_SIZE: 8
CTS_DISTANCE_BETWEEN_BUFFERS: 180
PNR_SDC_FILE: dir::chip_core.sdc
SIGNOFF_SDC_FILE: dir::chip_core.sdc
FP_DEF_TEMPLATE: dir::A34_ACE_scaled.def
DIE_AREA: [0, 0, 1675, 1675]
DESIGN_REPAIR_MAX_SLEW_PCT: 30
DESIGN_REPAIR_MAX_CAP_PCT: 30
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10   # %
RUN_POST_GRT_RESIZER_TIMING: true
RUN_POST_GRT_DESIGN_REPAIR: true
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 30
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 30
FP_SIZING: absolute
FP_CORE_UTIL: 30
PL_TARGET_DENSITY_PCT: 55
GRT_ALLOW_CONGESTION: true

# A34 boundary-power connectivity
# Fixed VDD/VSS terminals are on Metal2; the internal PDN is Metal4/Metal5.
VDD_NETS:
- VDD
GND_NETS:
- VSS
PDN_CFG: dir::pdn_cfg_a34.tcl

# A34 top-level power ring
# Localized M2-M3-M4 bridges connect the boundary pads to this M4/M5 PDN.
PDN_CORE_RING: true
PDN_CORE_RING_ALLOW_OUT_OF_DIE: false
PDN_CORE_RING_CONNECT_TO_PADS: false
PDN_CORE_RING_VOFFSET: 0.8
PDN_CORE_RING_HOFFSET: 0.8
PDN_CORE_RING_VWIDTH: 1.6
PDN_CORE_RING_HWIDTH: 1.6
PDN_CORE_RING_VSPACING: 1.7
PDN_CORE_RING_HSPACING: 1.7
PDN_EXTEND_TO: core_ring

# Q16 implementation: request setup headroom before detailed routing.
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.200
